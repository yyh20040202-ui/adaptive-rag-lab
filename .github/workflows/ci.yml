name: offline-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install offline-test dependencies
        run: pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 fastapi==0.115.6 pydantic==2.10.4 httpx==0.28.1 pytest==8.3.4 pypdf==6.10.0 psutil==7.0.0
      - name: Run data, metrics, quote-audit and API tests
        run: python -m pytest -q
